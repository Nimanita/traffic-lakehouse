<svg viewBox="0 0 1520 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B2545" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#33415C"/>
    </marker>
    <marker id="arrowHeadTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#14919B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1520" height="560" fill="#FFFFFF"/>
  <text x="20" y="34" font-size="19" font-weight="700" fill="#0B2545">ADF — incremental_pipeline</text>
  <text x="20" y="55" font-size="12.5" fill="#5B6472">one branch per table, driven by a CDC / watermark pattern</text>

  <!-- Outer ForEach -->
  <rect x="40" y="80" width="1440" height="320" rx="16" fill="#FAFBFC" stroke="#8A94A6" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="65" y="108" font-size="12.5" font-weight="700" fill="#5B6472">ForEach table in pipeline().parameters.items</text>

  <!-- Step 1 -->
  <rect x="80" y="150" width="280" height="180" rx="14" fill="#F1EFFC" stroke="#6C63FF" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="105" cy="175" r="14" fill="#0B2545"/>
  <text x="105" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <rect x="130" y="163" width="105" height="22" rx="11" fill="#6C63FF"/>
  <text x="182" y="178" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">SETVARIABLE</text>
  <text x="220" y="225" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2B2566">next_cdc</text>
  <text x="220" y="252" text-anchor="middle" font-size="11.5" fill="#4A447F">capture utcNow() as</text>
  <text x="220" y="270" text-anchor="middle" font-size="11.5" fill="#4A447F">the new watermark</text>

  <!-- Step 2 -->
  <rect x="440" y="150" width="280" height="180" rx="14" fill="#E6F6F4" stroke="#14919B" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="465" cy="175" r="14" fill="#0B2545"/>
  <text x="465" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <rect x="490" y="163" width="80" height="22" rx="11" fill="#14919B"/>
  <text x="530" y="178" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">LOOKUP</text>
  <text x="580" y="225" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B4A48">get_last_ingested_date</text>
  <text x="580" y="252" text-anchor="middle" font-size="11.5" fill="#2C6E6A">reads prior watermark from</text>
  <text x="580" y="270" text-anchor="middle" font-size="11.5" fill="#2C6E6A">azuremetadata/cdc/{file}.json</text>

  <!-- Step 3 -->
  <rect x="800" y="150" width="280" height="180" rx="14" fill="#E3F1FC" stroke="#1E88C7" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="825" cy="175" r="14" fill="#0B2545"/>
  <text x="825" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <rect x="850" y="163" width="70" height="22" rx="11" fill="#1E88C7"/>
  <text x="885" y="178" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">COPY</text>
  <text x="940" y="218" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B3A57">move_data_from</text>
  <text x="940" y="238" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B3A57">_council_to_landing</text>
  <text x="940" y="264" text-anchor="middle" font-size="11.5" fill="#3D6E8F">copies files modified between</text>
  <text x="940" y="282" text-anchor="middle" font-size="11.5" fill="#3D6E8F">last watermark → now, tags</text>
  <text x="940" y="300" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0B3A57">source = "B"</text>

  <!-- Step 4 -->
  <rect x="1160" y="150" width="280" height="180" rx="14" fill="#E3F1FC" stroke="#1E88C7" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="1185" cy="175" r="14" fill="#0B2545"/>
  <text x="1185" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
  <rect x="1210" y="163" width="70" height="22" rx="11" fill="#1E88C7"/>
  <text x="1245" y="178" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">COPY</text>
  <text x="1300" y="225" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B3A57">change_cdc_data</text>
  <text x="1300" y="252" text-anchor="middle" font-size="11.5" fill="#3D6E8F">overwrites the watermark file</text>
  <text x="1300" y="270" text-anchor="middle" font-size="11.5" fill="#3D6E8F">with next_cdc for the next run</text>

  <!-- sequential arrows -->
  <path d="M360,240 L438,240" fill="none" stroke="#33415C" stroke-width="2.4" marker-end="url(#arrowHead)"/>
  <path d="M720,240 L798,240" fill="none" stroke="#33415C" stroke-width="2.4" marker-end="url(#arrowHead)"/>
  <path d="M1080,240 L1158,240" fill="none" stroke="#33415C" stroke-width="2.4" marker-end="url(#arrowHead)"/>

  <!-- watermark store -->
  <rect x="610" y="470" width="300" height="66" rx="14" fill="#FDF6E3" stroke="#C79A1E" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="760" y="497" text-anchor="middle" font-size="13" font-weight="700" fill="#5C4A0A">CDC Watermark File</text>
  <text x="760" y="516" text-anchor="middle" font-size="11" fill="#7A611A">azuremetadata / cdc / {table}.json</text>

  <path d="M580,330 C 620,400 680,430 715,468" fill="none" stroke="#14919B" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowHeadTeal)"/>
  <text x="600" y="420" font-size="11" fill="#14919B" font-style="italic">reads</text>

  <path d="M905,468 C 940,430 1000,400 1300,330" fill="none" stroke="#14919B" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowHeadTeal)"/>
  <text x="960" y="420" font-size="11" fill="#14919B" font-style="italic">writes</text>
</svg>
